name: Windows MSVC Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type (Release/Debug)
        type: string
        default: Release
      publish_release:
        description: Publish artifacts to GitHub Release
        type: boolean
        default: false
      prerelease:
        description: Mark GitHub Release as prerelease
        type: boolean
        default: true
      version:
        description: Release version/tag (empty = short commit id)
        type: string
        default: ""
  workflow_call:
    inputs:
      build_type:
        description: Build type (Release/Debug)
        type: string
        default: Release
      publish_release:
        description: Publish artifacts to GitHub Release
        type: boolean
        default: false
      prerelease:
        description: Mark GitHub Release as prerelease
        type: boolean
        default: true
      version:
        description: Release version/tag (empty = short commit id)
        type: string
        default: ""
permissions:
  contents: write
jobs:
  build-msvc:
    runs-on: windows-2022
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: 2022
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: third_party/qt/6.10.1/msvc2022_64
          key: windows-msvc-qt-6.10.1-websockets-networkauth-multimedia-v1
      - name: Cache Meson wrap downloads
        uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: windows-msvc-meson-wraps-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}
      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: .ccache
          key: windows-msvc-ccache-${{ env.BUILD_TYPE }}-${{ hashFiles('pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windows-msvc-ccache-${{ env.BUILD_TYPE }}-${{ hashFiles('pixi.lock') }}-
            windows-msvc-ccache-${{ env.BUILD_TYPE }}-
            windows-msvc-ccache-
      - name: Build and install
        shell: pwsh
        env:
          LUNA_INSTALL_DIR: install
        run: |
          $profile = $env:BUILD_TYPE.ToLowerInvariant()
          pixi run ccache --zero-stats
          pixi run install $profile
      - name: Show compiler cache statistics
        if: ${{ always() }}
        shell: pwsh
        run: pixi run ccache --show-stats
      - name: Prepare portable package
        shell: pwsh
        run: |
          Copy-Item -Path install -Destination install-portable -Recurse
          New-Item -ItemType File -Path install-portable\portable.txt -Force
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Windows-MSVC-${{ github.sha }}-${{ inputs.build_type || 'Release' }}
          path: |
            install/**
            install-portable/**
      - name: Prepare release metadata
        id: release_meta
        if: ${{ inputs.publish_release }}
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = $shortSha }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $msg = (git log -1 --pretty=%B)
          "message<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $msg | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Package artifacts for release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"
          $buildType = "${{ inputs.build_type || 'Release' }}"
          $zip1 = "PrismLauncher-Windows-MSVC-$version-$buildType.zip"
          $zip2 = "PrismLauncher-Windows-MSVC-Portable-$version-$buildType.zip"
          if (Test-Path $zip1) { Remove-Item -Force $zip1 }
          if (Test-Path $zip2) { Remove-Item -Force $zip2 }
          Compress-Archive -Path "install\*" -DestinationPath $zip1 -Force
          Compress-Archive -Path "install-portable\*" -DestinationPath $zip2 -Force
      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Prism Launcher ${{ steps.release_meta.outputs.version }}
          body: ${{ steps.release_meta.outputs.message }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            PrismLauncher-Windows-MSVC-${{ steps.release_meta.outputs.version }}-${{ inputs.build_type || 'Release' }}.zip
            PrismLauncher-Windows-MSVC-Portable-${{ steps.release_meta.outputs.version }}-${{ inputs.build_type || 'Release' }}.zip
